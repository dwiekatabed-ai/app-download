<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التطبيق</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #007bff;
        }
        p {
            font-size: 16px;
            color: #666;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-apple {
            background-color: #000;
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            var androidUrl = "https://play.google.com/store/apps/details?id=mashreqins.app.gnet.mashreqins";
            var iosUrl = "https://apps.apple.com/us/app/pal-med-service/id1539913228";

            // فحص دقيق جداً لأجهزة أبل (آيفون، آيباد، آيبود)
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(iosUrl);
            } 
            // فحص دقيق لأجهزة أندرويد
            else if (/android/i.test(userAgent)) {
                window.location.replace(androidUrl);
            } 
            // إذا كان كمبيوتر أو نظام آخر
            else {
                document.getElementById("loading-text").style.display = "none";
                document.getElementById("manual-links").style.display = "block";
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <h2>جاري تحويلك إلى المتجر...</h2>
        <p id="loading-text">يرجى الانتظار لحظات ريثما يتم توجيهك للمتجر المناسب لجهازك.</p>
        
        <!-- تظهر فقط إذا فتح الرابط من جهاز كمبيوتر -->
        <div id="manual-links" style="display: none;">
            <p>يبدو أنك تستخدم جهاز حاسوب. يمكنك تحميل التطبيق بالضغط على أحد الأزرار أدناه:</p>
            <br>
            <a href="https://play.google.com/store/apps/details?id=mashreqins.app.gnet.mashreqins" class="btn">تحميل لأندرويد (Google Play)</a>
            <br>
            <a href="https://apps.apple.com/us/app/pal-med-service/id1539913228" class="btn btn-apple">تحميل لآبل (App Store)</a>
        </div>
    </div>
</body>
</html>
